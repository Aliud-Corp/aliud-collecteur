name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Pas de job `hacs/action`. Il valide une candidature au magasin HACS par
  # défaut : des sujets de dépôt, une licence, et une inscription au dépôt
  # `home-assistant/brands`. Ce dépôt est privé et s'installe en dépôt
  # personnalisé, donc l'action refuserait une publication que personne ne
  # demande. Le jour où le dépôt devient public et candidate, ce bloc revient
  # avec ce qu'il exige.

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Les deux ensemble, et épinglés ensemble : le harnais embarque ses
      # propres correctifs pour une version de Home Assistant précise, et un
      # couple dépareillé échoue au démarrage sur un attribut absent, pas sur
      # le code testé. Relevé le 29/08/2026 en montant 2026.8.3 sur le harnais
      # de 2026.7.4.
      - run: pip install homeassistant==2026.8.3 pytest-homeassistant-custom-component==0.13.357
      - run: pytest
